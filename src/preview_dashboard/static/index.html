<!--

  shortcut), desktop icons (Feed, Trash), the window area (#main, rendered by /static/app.js) and the pixel-icon sprite.
  The look comes from the active OS under /static/os/ (docs/frontend-os.md). Served under the
  dashboard CSP (docs/security.md C6): no inline scripts, styles or event-handler attributes here.
-->
