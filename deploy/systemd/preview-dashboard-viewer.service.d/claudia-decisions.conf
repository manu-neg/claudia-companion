# claudia-decisions.conf -- drop-in installed by install.sh on Claudia hosts only.
# Lets the viewer reach admin.sock for dashboard Approve/Deny (F-CL6, ADR 0043,
# C46) by restating the viewer's InaccessiblePaths= WITHOUT /run/preview-dashboard
# (the unit 12 L1 mask); hosts without Claudia keep that mask. Keep both lines in
# step with the static unit (tests/unit/test_deploy_artifacts.py compares them).

[Service]
# Empty assignment resets every InaccessiblePaths= of the main unit.
InaccessiblePaths=
InaccessiblePaths=/root /home /etc/preview-dashboard/admin.token
InaccessiblePaths=-/var/lib/preview-dashboard/claudia -/var/lib/preview-dashboard/voice -/var/lib/claudia-host -/etc/preview-dashboard/totp.secret -/etc/preview-dashboard/claudia.token
