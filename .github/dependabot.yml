# Dependabot: weekly update PRs for pinned GitHub Actions (SHA pins) and uv deps.
# Keeps SHA-pinned actions and uv.lock from silently going stale (docs/security.md C13).

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
