# CI: runs the same checks as `make check` plus a secret scan on every push and PR.
# Hardened: read-only token, actions pinned to commit SHAs, no persisted git
# credentials, locked deps, time-boxed. No deploy step (see docs/operations.md).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums.txt.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # S1 follow-up: without this, tests/unit/test_api_client.py and the
      # node-run checks in tests/unit/test_static_ui.py / test_fx_isolation.py
      # silently skip (no `node` binary) instead of running, so the Safari
      # CSRF regression guard (R1) and the fx JS parse/URI checks could pass
      # CI without ever executing.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies (locked; fails if uv.lock is stale)
        run: uv sync --locked

      # Binary pinned by version + sha256 (not the gitleaks-action wrapper):
      # no third-party action code, no license key, verifiable artifact.
      - name: Secret scan (gitleaks, full history)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      # Run as root: the security suite checks root-owned config/token
      # files, chowns fixtures to foreign uids, binds/probes Unix sockets
      # with SO_PEERCRED and runs `nft -c` (needs CAP_NET_ADMIN) — the
      # same conditions as the deployed host. The runner has passwordless sudo.
      - name: pytest (as root)
        run: sudo --preserve-env=PATH "$(command -v uv)" run --frozen pytest

      - name: bandit
        run: uv run bandit -c pyproject.toml -r src

      - name: pip-audit
        run: uv run pip-audit --progress-spinner off

      # voice-4: `uv sync --locked` above installs no extras, so the step
      # above never sees the host's TTS stack (piper-tts, onnxruntime, numpy,
      # soundfile). Audit the locked claudia-voice extra from an export:
      # pinned + hashed, nothing installed, no resolution by pip.
      - name: pip-audit (claudia-voice extra)
        run: |
          set -euo pipefail
          uv export --locked --no-dev --extra claudia-voice --no-emit-project \
            --format requirements-txt -o "$RUNNER_TEMP/voice-requirements.txt"
          uv run pip-audit --progress-spinner off --disable-pip \
            -r "$RUNNER_TEMP/voice-requirements.txt"
